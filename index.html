<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Check-in">
<meta name="theme-color" content="#4a9aa8">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Check-in</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg:      #eaeeef;
    --teal:    #4a9aa8;
    --title:   #3d8a98;
    --ring:    #a8d4c8;
  }

  html, body {
    height: 100%;
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    overflow: hidden;
  }

  /* ══════════════════════════════
     CAMERA SCREEN
  ══════════════════════════════ */
  #camera-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;
  }

  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  #tap-area { position: absolute; inset: 0; z-index: 9; cursor: pointer; }

  .cam-topbar {
    position: relative; z-index: 10; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.97);
    padding: 13px 20px;
    padding-top: calc(13px + env(safe-area-inset-top));
  }
  .cam-title { font-size: 17px; font-weight: 700; color: #111; letter-spacing: .1px; }

  .qr-wrap {
    position: relative; z-index: 10; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; pointer-events: none;
  }
  .qr-text { color: #fff; font-size: 15px; font-weight: 500; text-align: center; padding: 0 40px; text-shadow: 0 1px 6px rgba(0,0,0,.55); }
  .qr-frame { width: 220px; height: 220px; position: relative; overflow: hidden; }
  .qr-frame::before, .qr-frame::after, .qr-inner::before, .qr-inner::after {
    content: ''; position: absolute; width: 38px; height: 38px; border-color: #fff; border-style: solid;
  }
  .qr-frame::before { top:0; left:0;  border-width: 3.5px 0 0 3.5px; border-radius: 5px 0 0 0; }
  .qr-frame::after  { top:0; right:0; border-width: 3.5px 3.5px 0 0; border-radius: 0 5px 0 0; }
  .qr-inner { position: absolute; inset: 0; }
  .qr-inner::before { bottom:0; left:0;  border-width: 0 0 3.5px 3.5px; border-radius: 0 0 0 5px; }
  .qr-inner::after  { bottom:0; right:0; border-width: 0 3.5px 3.5px 0; border-radius: 0 0 5px 0; }

  /* Scan line */
  .scan-line {
    position: absolute;
    left: 8px; right: 8px;
    height: 2.5px;
    border-radius: 2px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(100,220,200,0.6) 20%,
      rgba(100,220,200,1) 50%,
      rgba(100,220,200,0.6) 80%,
      rgba(255,255,255,0) 100%
    );
    box-shadow: 0 0 8px 3px rgba(100,220,200,0.5), 0 0 20px 6px rgba(100,220,200,0.2);
    top: 10px;
    animation: scanMove 2s ease-in-out infinite;
  }
  @keyframes scanMove {
    0%   { top: 10px;  opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { top: 200px; opacity: 0; }
  }

  /* ══════════════════════════════
     RESULT SCREEN  — full bleed
  ══════════════════════════════ */
  #result-screen {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    flex-direction: column;
    align-items: stretch;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Teal quarter circles — all 4 corners, bigger */
  .c { position: fixed; overflow: hidden; pointer-events: none; z-index: 2; }

  /* Diagonal teal stripes behind the card */
  .stripe {
    position: fixed;
    width: 54px;
    background: var(--teal);
    opacity: .88;
    pointer-events: none;
    z-index: 1;
    border-radius: 6px;
    transform: rotate(-38deg);
  }
  .stripe-1 {
    height: 260px;
    left: -18px;
    top: 18%;
  }
  .stripe-2 {
    height: 200px;
    left: -14px;
    top: 50%;
  }
  .stripe-3 {
    height: 220px;
    right: -18px;
    bottom: 8%;
  }

  /* Nav */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 20px;
    padding-top: calc(13px + env(safe-area-inset-top));
    flex-shrink: 0;
  }
  .topbar-ck    { font-size: 15px; font-weight: 500; font-style: normal; color: #1a2a30; letter-spacing: .5px; min-width: 36px; }
  .topbar-title { font-size: 17px; font-weight: 700; color: #2e3e44; letter-spacing: .1px; }
  .topbar-x {
    min-width: 36px; text-align: right;
    background: none; border: none; cursor: pointer;
    font-size: 21px; color: #9ab0b8; line-height: 1;
    font-family: inherit;
  }

  /* Card — fills almost all space */
  .card-wrap {
    flex: 1;
    display: flex; align-items: stretch;
    padding: 8px 14px 10px;
    position: relative; z-index: 5;
    min-height: 0;
  }

  .card {
    background: #fff;
    border-radius: 26px;
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    padding: 36px 28px 40px;
    box-shadow: 0 3px 28px rgba(50,90,100,.10), 0 1px 5px rgba(50,90,100,.07);
    overflow: hidden;
  }
  .card.pop { animation: cardPop .46s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes cardPop {
    from { opacity:0; transform: scale(.88) translateY(16px); }
    to   { opacity:1; transform: scale(1)   translateY(0); }
  }

  .card-title {
    font-size: 28px; font-weight: 600;
    color: #2d6e7a;
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: -.3px;
    line-height: 1.2;
  }

  /* Avatar — mint ring, soft pulse */
  .avatar-wrap {
    width: 148px; height: 148px;
    border-radius: 50%;
    border: 4px solid #7ecfbe;
    padding: 4px;
    margin-bottom: 28px;
    background: #fff;
    flex-shrink: 0;
    animation: ringPulse 2s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,100% {
      box-shadow:
        0 0 0  8px  rgba(126,207,190, .50),
        0 0 30px 16px  rgba(126,207,190, .55),
        0 0 65px 32px  rgba(126,207,190, .35),
        0 0 110px 55px rgba(126,207,190, .18),
        0 0 160px 80px rgba(126,207,190, .07);
    }
    50% {
      box-shadow:
        0 0 0 18px  rgba(126,207,190, .72),
        0 0 55px 30px  rgba(126,207,190, .85),
        0 0 100px 55px rgba(126,207,190, .50),
        0 0 160px 80px rgba(126,207,190, .28),
        0 0 220px 110px rgba(126,207,190, .12);
    }
  }
  .avatar-wrap img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }

  .card-name {
    font-size: 24px; font-weight: 800;
    color: #1a2a30;
    margin-bottom: 10px;
    letter-spacing: -.2px;
  }
  .card-location {
    font-size: 14px; font-weight: 500;
    color: #8aa0a8;
    margin-bottom: 6px;
    text-align: center;
    line-height: 1.4;
  }
  .card-time {
    font-size: 14px; font-weight: 700;
    color: #5a8090;
  }

  /* Footer with real logo */
  .footer {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    padding: 32px 0 20px;
    flex-shrink: 0;
  }
  .footer svg {
    width: 140px;
    height: auto;
    opacity: .5;
  }

  /* Flash */
  .flash { position:fixed; inset:0; background:#fff; z-index:200; animation:flashOut .28s ease forwards; pointer-events:none; }
  @keyframes flashOut { 0%{opacity:1} 100%{opacity:0} }

  /* Install banner */
  #install-banner { display:none; position:fixed; bottom:0;left:0;right:0;z-index:300; background:rgba(255,255,255,.97); backdrop-filter:blur(16px); border-top:1px solid rgba(0,0,0,.08); padding:16px 20px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); flex-direction:column; gap:10px; box-shadow:0 -8px 32px rgba(0,0,0,.12); }
  .b-row { display:flex; align-items:center; gap:14px; }
  .b-icon { width:48px;height:48px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0; }
  .b-text h3 { font-size:15px;font-weight:700;color:#111; }
  .b-text p  { font-size:13px;color:#888;margin-top:1px; }
  .b-close { margin-left:auto;background:none;border:none;font-size:20px;color:#aaa;cursor:pointer;padding:4px; }
  .b-steps { display:flex;align-items:center;gap:8px;background:#f5f5f5;border-radius:12px;padding:10px 14px;font-size:13px;color:#555; }
</style>
</head>
<body>

<!-- CAMERA -->
<div id="camera-screen">
  <video id="video" autoplay playsinline muted></video>
  <div id="tap-area"></div>
  <div class="cam-topbar"><span class="cam-title">Check-in</span></div>
  <div class="qr-wrap">
    <div class="qr-text">Bitte scann den QR-Code um einzuchecken.</div>
    <div class="qr-frame">
      <div class="qr-inner"></div>
      <div class="scan-line"></div>
    </div>
  </div>
</div>

<!-- INSTALL BANNER -->
<div id="install-banner">
  <div class="b-row">
    <div class="b-icon">✓</div>
    <div class="b-text"><h3>Als App installieren</h3><p>Zum Home-Bildschirm hinzufügen</p></div>
    <button class="b-close" id="b-close-btn">✕</button>
  </div>
  <div class="b-steps"><span>⬆️</span> Tippe auf <strong style="margin:0 4px">Teilen</strong> → <strong style="margin-left:4px">Zum Home-Bildschirm</strong></div>
</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

  const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode:standalone)').matches;
  const safari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
  if (!standalone && safari && !sessionStorage.getItem('b-dismissed')) {
    setTimeout(()=>{ document.getElementById('install-banner').style.display='flex'; }, 3000);
  }
  document.getElementById('b-close-btn').addEventListener('click',()=>{
    document.getElementById('install-banner').style.display='none';
    sessionStorage.setItem('b-dismissed','1');
  });

  let stream = null;
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
      document.getElementById('video').srcObject = stream;
    } catch { alert('Kamera-Zugriff nötig. Bitte in Safari-Einstellungen aktivieren.'); }
  }
  function stopCamera() { if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

  startCamera();

  function doCheckin() {
    const f = document.createElement('div'); f.className='flash'; document.body.appendChild(f);
    setTimeout(()=>f.remove(), 300);

    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const yy = String(now.getFullYear()).slice(-2);
    const hh = String(now.getHours()).padStart(2,'0');
    const mi = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('display-time').textContent = dd+'.'+mm+'.'+yy+', '+hh+':'+mi;

    stopCamera();
    document.getElementById('camera-screen').style.display = 'none';
    const rs = document.getElementById('result-screen');
    rs.style.display = 'flex';

    const card = document.getElementById('card');
    card.classList.remove('pop');
    void card.offsetWidth;
    card.classList.add('pop');
  }

  document.getElementById('tap-area').addEventListener('click', doCheckin);
  document.getElementById('tap-area').addEventListener('touchend', e=>{ e.preventDefault(); doCheckin(); });

  document.getElementById('back-btn').addEventListener('click', ()=>{
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('camera-screen').style.display = 'flex';
    startCamera();
  });
</script>
